services:
  context-garden:
    build: .
    restart: unless-stopped
    ports:
      - "7433:7433"
    volumes:
      - ./data:/data
      - ~/.ssh:/root/.ssh:ro
    environment:
      # Point at your homelab Ollama instance
      CG_OLLAMA_HOST: "${CG_OLLAMA_HOST:-http://localhost:11434}"
      CG_WEBAPP_PORT: "7433"
    extra_hosts:
      # Lets the container reach host-network services on Linux
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7433/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
